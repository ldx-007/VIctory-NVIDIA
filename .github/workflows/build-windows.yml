# Builds this fork's layer for Windows, so a PC with no Rust toolchain can still play:
# download an artifact, unpack it into <this checkout>\target\release\ or
# <this checkout>\target\diag\ as victory.exe, keeping toolchain.txt beside it.
#
# main is upstream main (github.com/trustno1-coder/VIctory-NVIDIA) plus this one
# file, so the rest of the branch stays exactly upstream.  To build: Actions /
# "Build VIctory-NVIDIA for Windows" / Branch: main / Run workflow.  A few
# minutes on a warm cache, longer on the very first run.
#
# Which artifact to take:
#   nvidia-windows-x64-release   what the launcher wants by default
#                                (scripts\play-foxhound.ps1 builds with -Build release)
#   nvidia-windows-x64-diag      with the diagnostics feature: frame capture, the
#                                Direct3D debug layer, stack dumps; slower, and what
#                                the fork's own numbers are measured with
#
# DLSS is no longer compiled in.  Since the tree moved onto the foxhound base the
# NVIDIA files are only loaded when the game runs, so both jobs below are plain
# cargo builds and nothing of NVIDIA's is fetched here.  Get them once on the PC
# you play on: Get-NVIDIA-DLSS.cmd in the checkout's folder (about 70 MB from
# NVIDIA's own GitHub into nvidia-sdk\Streamline\bin\x64, git-ignored), or
# "victory.exe get-dlss".  F1 in the game is the settings menu, and frame
# generation is switched there.
#
# rust-toolchain.toml pins the toolchain; rust-cache keeps the dependency build
# between runs, keyed per job so the two do not throw each other's work away.

name: Build VIctory-NVIDIA for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build
        run: cargo build --locked --release -p victory
      - name: What made this
        shell: pwsh
        run: |
          $what = @((cargo --version), (rustc --version), ("commit " + (git rev-parse --short HEAD))) -join ' / '
          $what | Set-Content -Encoding ascii target/release/toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nvidia-windows-x64-release
          path: |
            target/release/victory.exe
            target/release/toolchain.txt
          if-no-files-found: error
          retention-days: 30

  diag:
    name: diag, with diagnostics
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: diag
      - name: Build
        run: cargo build --locked --profile diag -p victory --features diagnostics
      - name: What made this
        shell: pwsh
        run: |
          $what = @((cargo --version), (rustc --version), ("commit " + (git rev-parse --short HEAD))) -join ' / '
          $what | Set-Content -Encoding ascii target/diag/toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nvidia-windows-x64-diag
          path: |
            target/diag/victory.exe
            target/diag/toolchain.txt
            target/diag/*.pdb
          if-no-files-found: error
          retention-days: 30
